---
layout: false
---
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Shellmega Admin</title>
  <link rel="icon" href="/linen-theme/favicon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/decap-cms@^3.6.4/dist/decap-cms.css" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
  </style>
</head>
<body>
  <script type="text/yaml">
backend:
  name: github
  repo: Shellmega/shellmega.github.io
  branch: main
  auth_type: oauth
  app_id: Ov23ctojIioxz4sbuFGL
  proxy_url: https://oauth-proxy-eight.vercel.app

media_folder: "source/images"
public_folder: "/images"

site_url: https://shellmega.github.io

collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "source/_posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: frontmatter
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime" }
      - { label: "描述", name: "description", widget: "string", required: false }
      - { label: "封面图", name: "cover", widget: "image", required: false }
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
      - label: "分类"
        name: "categories"
        widget: "list"
        required: false
      - { label: "内容", name: "_content", widget: "markdown" }
  - name: "pages"
    label: "页面"
    label_singular: "页面"
    folder: "source"
    create: false
    filter: { field: "layout", value: "page" }
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "布局", name: "layout", widget: "hidden", default: "page" }
      - { label: "内容", name: "_content", widget: "markdown" }
  </script>
  <script src="https://unpkg.com/decap-cms@^3.6.4/dist/decap-cms.js"></script>
</body>
</html>

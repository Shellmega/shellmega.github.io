# Decap CMS 配置
# 文档: https://decapcms.org/docs/

backend:
  name: github
  repo: Shellmega/shellmega.github.io
  branch: hexo            # 内容源分支（GitHub Actions 监听该分支自动构建部署）
  base_url: https://oauth-proxy-eight.vercel.app
  auth_endpoint: auth
  auth_scope: repo        # 需要读写仓库内容
  squash_merges: true

# 发布模式：草稿/审核工作流（提交会先以 PR 形式存在）
publish_mode: editorial_workflow

site_url: https://shellmega.github.io
display_url: https://shellmega.github.io
logo_url: https://shellmega.github.io/linen-theme/img/logo.svg

# 媒体文件：存入 hexo 分支的 source/images，构建后发布到 /images
media_folder: "source/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "文章"
    folder: "source/_posts"
    create: true
    slug: "{{slug}}"
    preview_path: "{{year}}/{{month}}/{{day}}/{{slug}}/"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime" }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "分类", name: "categories", widget: "list", required: false }
      - { label: "摘要描述", name: "description", widget: "text", required: false }
      - { label: "正文", name: "body", widget: "markdown" }

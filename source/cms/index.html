---
layout: false
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>内容管理 · Shellmega</title>
  <link rel="icon" href="/linen-theme/favicon.svg" type="image/svg+xml" />
  <style>
    /* 博客园经典风格 */
    :root {
      --cn-blue: #2e4b8f;        /* 博客园经典深蓝 */
      --cn-blue-light: #4c9ed9;  /* 浅蓝 */
      --cn-blue-dark: #1f3a6d;   /* 导航渐变深端 */
      --cn-orange: #f60;         /* 博客园橙 */
      --cn-bg: #f5f5f5;          /* 页面浅灰底 */
      --cn-card: #ffffff;
      --cn-border: #d5dce6;
      --cn-text: #333333;
      --cn-muted: #999999;
      --cn-link: #2e4b8f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
      background: var(--cn-bg);
      color: var(--cn-text);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* 顶部蓝色导航条 (博客园标志性元素) */
    .cn-nav {
      background: linear-gradient(to bottom, var(--cn-blue-light) 0%, var(--cn-blue) 55%, var(--cn-blue-dark) 100%);
      color: #fff;
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .cn-nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .cn-nav-brand .cn-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--cn-orange);
      border-radius: 2px;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35);
    }

    .cn-nav-links {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 1px;
    }

    /* 主体: 居中卡片 */
    .cn-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .cn-card {
      background: var(--cn-card);
      border: 1px solid var(--cn-border);
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(46, 75, 143, 0.12);
      padding: 40px 56px 36px;
      text-align: center;
      min-width: 340px;
      max-width: 92vw;
      position: relative;
    }

    /* 卡片顶部蓝色饰条 (博客园面板风格) */
    .cn-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(to right, var(--cn-blue), var(--cn-blue-light));
      border-radius: 6px 6px 0 0;
    }

    .cn-logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 18px;
      display: block;
      border: 1px solid var(--cn-border);
      border-radius: 50%;
      padding: 8px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .cn-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--cn-blue);
      letter-spacing: 2px;
    }

    .cn-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: var(--cn-muted);
      letter-spacing: 1px;
    }

    .cn-divider {
      width: 56px;
      height: 2px;
      background: var(--cn-orange);
      margin: 16px auto;
      border: none;
    }

    /* 经典博客园蓝色 spinner */
    .cn-spinner {
      width: 28px;
      height: 28px;
      margin: 8px auto 0;
      border: 3px solid #c8d4e8;
      border-top-color: var(--cn-blue);
      border-radius: 50%;
      animation: cn-spin 0.8s linear infinite;
    }

    @keyframes cn-spin {
      to { transform: rotate(360deg); }
    }

    .cn-loading-text {
      margin-top: 14px;
      font-size: 13px;
      color: var(--cn-blue);
      letter-spacing: 2px;
      animation: cn-pulse 1.5s ease-in-out infinite;
    }

    @keyframes cn-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* 底部 (博客园经典页脚) */
    .cn-footer {
      padding: 10px 0 14px;
      text-align: center;
      font-size: 12px;
      color: var(--cn-muted);
      letter-spacing: 0.5px;
    }

    .cn-footer a {
      color: var(--cn-link);
      text-decoration: none;
    }
    .cn-footer a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      .cn-spinner { animation: none; border-top-color: #c8d4e8; }
      .cn-loading-text { animation: none; opacity: 0.8; }
    }
  </style>
</head>
<body>
  <header class="cn-nav">
    <div class="cn-nav-brand">
      <span class="cn-dot"></span>
      <span>内容管理</span>
    </div>
    <div class="cn-nav-links">Shellmega Blog · 博客园风格</div>
  </header>

  <main class="cn-main">
    <div class="cn-card">
      <img class="cn-logo" src="/linen-theme/img/logo_black.svg" alt="Shellmega" />
      <div class="cn-title">内容管理后台</div>
      <div class="cn-subtitle">Shellmega Blog</div>
      <hr class="cn-divider" />
      <div class="cn-spinner" role="status" aria-label="加载中"></div>
      <div class="cn-loading-text">正在加载内容管理后台…</div>
    </div>
  </main>

  <footer class="cn-footer">
    Powered by <a href="https://decapcms.org/" target="_blank" rel="noopener">Decap CMS</a> · &copy; Shellmega
  </footer>

  <script src="/cms/decap-cms.js"></script>
</body>
</html>
